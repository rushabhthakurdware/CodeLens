services:
  db:
    image: ankane/pgvector:latest  # We use this instead of standard postgres to get 'pgvector'
    container_name: codelens-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: codelens_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Rushabh@123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


